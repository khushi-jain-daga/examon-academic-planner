<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Examon Academic Planner</title>
  <meta name="description" content="Study plan generator for Examon Education" />
  <link rel="icon" href="assets/examon-logo.webp" />
  <link rel="stylesheet" href="stable-styles.css?v=7" />
  <link rel="stylesheet" href="ui-pdf-fixes.css?v=5" />
</head>
<body>
  <div id="app"><div style="font-family:Arial,sans-serif;max-width:760px;margin:60px auto;padding:24px">Loading Examon Academic Planner…</div></div>
  <script src="source-plans-seed.js?v=5"></script>
  <script src="source-seed-corrections.js?v=3"></script>
  <script src="extra-source-plans-seed.js?v=1"></script>
  <script>
    (async function(){
      const app = document.getElementById('app');
      try {
        let code = await fetch('stable-app.js?v=9', {cache:'no-store'}).then(r => {
          if (!r.ok) throw new Error('stable-app.js failed to load: ' + r.status);
          return r.text();
        });
        code = code.replace(
          "let state=load(),draft=blankDraft(),editingSubject=null,editingFaculty=null;",
          "var state;let draft=blankDraft(),editingSubject=null,editingFaculty=null;state=load();"
        );
        code = code.replace(
          "function sub(id){return state.subjects.find(s=>s.id===id)||SUBJECTS.find(s=>s.id===id)} function fac(id){return state.faculty.find(f=>f.id===id)||FACULTY.find(f=>f.id===id)||{name:id}}",
          "function sub(id){const ss=(state&&state.subjects)||SUBJECTS;return ss.find(s=>s.id===id)||SUBJECTS.find(s=>s.id===id)} function fac(id){const ff=(state&&state.faculty)||FACULTY;return ff.find(f=>f.id===id)||FACULTY.find(f=>f.id===id)||{name:id}}"
        );
        code = code.replace(
          "function defaultDraft(){let d=blankDraft();d.selectedFacultyIds=['f-gaurav','f-shivam','f-amrit','f-anjna','f-joshit'];d.modules=PDF_DEFAULT_IDS.map((id,i)=>moduleFromSubject(sub(id),{priority:i+1}));return d;}",
          "function defaultDraft(){let base=(state&&state.plans||[]).find(p=>p.id==='plan-rrb-raj')||(state&&state.plans||[])[0];if(base){let mods=cleanModules(base.modules||[]).map((m,i)=>({...m,id:uid('mod'),priority:m.priority||i+1,customStart:m.customStart||m.startDate,startTime:m.startTime||m.time||'10:00'}));return{...blankDraft(),examName:base.examName,batchName:base.batchName,branch:base.branch,planType:base.planType,startDate:base.startDate,selectedFacultyIds:[...new Set(mods.flatMap(m=>m.facultyIds||[]))],modules:mods};}let d=blankDraft();d.selectedFacultyIds=['f-gaurav','f-shivam','f-amrit','f-anjna','f-joshit'];d.modules=PDF_DEFAULT_IDS.map((id,i)=>moduleFromSubject(sub(id),{priority:i+1}));return d;}"
        );
        code = code.replace(
          "function sessions(mods){let out=[];cleanModules(mods).forEach(m=>{dates(m.customStart,m.classes).forEach((date,i)=>out.push({moduleId:m.id,subjectId:m.subjectId,subjectName:m.subjectName,topic:m.subjectName+' - '+(i+1),category:m.category,facultyIds:m.facultyIds,time:m.startTime,date,day:day(date),n:i+1}))});return out.sort((a,b)=>a.date.localeCompare(b.date)||min(a.time)-min(b.time)||a.subjectName.localeCompare(b.subjectName))}",
          "function sessions(mods){let out=[];function dBetween(start,end,count){let a=[],c=start,g=0;while(a.length<count&&g++<900){if(isWork(c))a.push(c);if(end&&c>=end)break;c=addDays(c,1)}while(a.length<count){c=a.length?addDays(a[a.length-1],1):start;if(isWork(c))a.push(c)}if(end&&a.length) a[a.length-1]=end;return a.slice(0,count)}cleanModules(mods).forEach(m=>{let ds=m.endDate?dBetween(m.customStart||m.startDate,m.endDate,m.classes):dates(m.customStart,m.classes);ds.forEach((date,i)=>out.push({moduleId:m.id,subjectId:m.subjectId,subjectName:m.subjectName,topic:(m.topicPrefix?m.topicPrefix:m.subjectName)+' - '+(i+1),category:m.category,facultyIds:m.facultyIds,time:m.startTime,date,day:day(date),n:i+1}))});return out.sort((a,b)=>a.date.localeCompare(b.date)||min(a.time)-min(b.time)||a.subjectName.localeCompare(b.subjectName))}"
        );
        code = code.replace(
          "function summary(mods){let ss=sessions(mods),uniq=[...new Set(ss.map(s=>s.date))];return{total:ss.length,tech:ss.filter(s=>s.category.includes('Technical')&&!s.category.includes('Non-')).length,non:ss.filter(s=>s.category.includes('Non-')).length,active:uniq.length,start:ss[0]?.date||'',end:ss.at(-1)?.date||'',fac:[...new Set(mods.flatMap(m=>m.facultyIds||[]))].length}}",
          "function summary(mods){let ss=sessions(mods),live=ss.filter(s=>s.date!=='Recorded'),uniq=[...new Set(live.map(s=>s.date))];const isNon=s=>String(s.category||'').toLowerCase().includes('non');const isTech=s=>!isNon(s)&&(String(s.category||'').toLowerCase().includes('tech')||String(s.subjectName||'').toLowerCase().includes('engineering')||String(s.subjectName||'').toLowerCase().includes('mechanic'));return{total:ss.length,tech:ss.filter(isTech).length,non:ss.filter(isNon).length,active:uniq.length,start:live[0]?.date||ss[0]?.date||'',end:live.at(-1)?.date||ss.at(-1)?.date||'',fac:[...new Set((mods||[]).flatMap(m=>m.facultyIds||[]))].length}}"
        );
        code = code.replace(
          "function makePlan(d){let mods=cleanModules(d.modules),sum=summary(mods);return{id:uid('plan'),examName:d.examName,batchName:d.batchName,branch:d.branch,planType:d.planType,startDate:sum.start||d.startDate,endDate:sum.end,status:'Draft',modules:mods,sessions:sessions(mods),createdAt:new Date().toISOString()}}",
          "function makePlan(d){let mods=cleanModules(d.modules),sum=summary(mods);return{id:d.id||uid('plan'),examName:d.examName,batchName:d.batchName,branch:d.branch,planType:d.planType,startDate:sum.start||d.startDate,endDate:sum.end,status:d.status||'Draft',modules:mods,sessions:sessions(mods),createdAt:d.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()}}"
        );
        code = code.replace(
          "<div><button class=\"btn primary\" data-edit-plan=\"${p.id}\">Edit in Creator</button> <a class=\"btn gold\" href=\"#/print/${p.id}\">Print / Save PDF</a></div>",
          "<div class=\"plan-actions\"><button class=\"btn primary\" data-edit-plan=\"${p.id}\">Edit in Creator</button><a class=\"btn gold\" href=\"#/print/${p.id}\">Print / Save PDF</a></div>"
        );
        code = code.replace(
          "<td><a class=\"btn primary\" href=\"#/plans/${p.id}\">Open</a> <button class=\"btn danger\" data-delete-plan=\"${p.id}\">Delete</button></td>",
          "<td class=\"row-actions\"><a class=\"btn primary\" href=\"#/plans/${p.id}\">Open</a><button class=\"btn\" data-edit-plan=\"${p.id}\">Edit</button><button class=\"btn danger\" data-delete-plan=\"${p.id}\">Delete</button></td>"
        );
        code = code.replace("for(let i=0;i<ss.length;i+=24)chunks.push(ss.slice(i,i+24));", "for(let i=0;i<ss.length;i+=18)chunks.push(ss.slice(i,i+18));");
        code = code.replace("Sessions ${i*24+1}–${i*24+rows.length} of ${total}", "Sessions ${i*18+1}–${i*18+rows.length} of ${total}");
        code = code.replace(/<b>\$\{p\.sessions\.length\}<\/b>/g,"<b>${p.sourceTotals?.total||p.sessions.length}</b>");
        code = code.replace(/<b>\$\{sum\.total\}<\/b>/g,"<b>${p.sourceTotals?.total||sum.total}</b>");
        code = code.replace(/<b>\$\{sum\.tech\}<\/b>/g,"<b>${p.sourceTotals?.tech||sum.tech}</b>");
        code = code.replace(/<b>\$\{sum\.non\}<\/b>/g,"<b>${p.sourceTotals?.non||sum.non}</b>");
        new Function(code)();
      } catch (err) {
        console.error(err);
        app.innerHTML = '<div style="font-family:Arial,sans-serif;max-width:760px;margin:60px auto;padding:28px;background:#fff;border-radius:16px"><h1>Unable to load Examon Academic Planner</h1><p>'+String(err.message||err)+'</p><button onclick="localStorage.removeItem(\'examonPlannerStableV2\');location.reload()" style="padding:12px 18px;border-radius:10px;border:0;background:#18c0c7;font-weight:700">Reset App Data & Reload</button></div>';
      }
    })();
  </script>
</body>
</html>
